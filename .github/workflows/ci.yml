name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: devlanes version the end-to-end jobs install (latest, next or X.Y.Z)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Empty uses the default from action.yml. A dispatch can test another release, such as next.
env:
  DEVLANES_TEST_VERSION: ${{ inputs.version }}

jobs:
  checks:
    name: Lint, types, unit tests and dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint-ci

      - name: Typecheck
        run: pnpm test-types

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The runner executes the committed dist/, so it must be exactly what the sources build.
      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            git diff --stat -- dist
            # .gitattributes marks dist/ as -diff, which would print only "Binary files differ".
            git diff --text -- dist | head -100
            echo "::error::dist/ differs from a fresh build; run pnpm build and commit dist/"
            exit 1
          fi

  e2e:
    name: ${{ matrix.command }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 resolves *.localhost only through the hosts entries the action writes.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15, windows-latest]
        command: [start, with]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the lane
        if: matrix.command == 'start'
        id: start
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/basic
          # The default name must differ per matrix job; the artifacts job counts them.
          upload-logs: always
          retention-days: 1

      - name: Check the outputs and the lane
        if: matrix.command == 'start'
        run: node test/e2e/check.mjs
        env:
          URLS: ${{ steps.start.outputs.urls }}
          SERVICES: ${{ steps.start.outputs.services }}
          HTTPS_PORT: ${{ steps.start.outputs.https-port }}
          LANE: ${{ steps.start.outputs.lane }}

      - name: Call the API with curl through the system store
        if: matrix.command == 'start' && runner.os == 'Linux'
        run: curl -fsS "$API/healthz"
        env:
          # Step env is evaluated even when `if` skips the step, so the JSON must always parse.
          API: ${{ fromJSON(steps.start.outputs.urls || '{}').api }}

      - name: Run the check against the lane
        if: matrix.command == 'with'
        id: with
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: with
          working-directory: test/fixtures/basic
          run: node ../../e2e/check.mjs
          retention-days: 1

      - name: Check the exit code output
        if: matrix.command == 'with' && steps.with.outputs.exit-code != '0'
        run: |
          echo "::error::exit-code is '${{ steps.with.outputs.exit-code }}', expected 0"
          exit 1

  infra:
    name: Containers and Chromium on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: true
          require-lockfile: true

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Start the lane
        id: devlanes
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/infra
          retention-days: 1

      - name: Check the container, its hostname and Chromium's trust
        run: node test/e2e/infra.mjs
        env:
          INFRA: ${{ steps.devlanes.outputs.infra }}
          URLS: ${{ steps.devlanes.outputs.urls }}
          DOMAIN: ${{ steps.devlanes.outputs.domain }}

      - name: Stop the lane and upload its logs
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: stop
          working-directory: test/fixtures/infra
          upload-logs: always
          artifact-name: devlanes-logs-stop
          retention-days: 1

  failure:
    name: Failed start on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start a lane with a broken service
        id: devlanes
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/failing
          timeout: 60s
          artifact-name: devlanes-logs-failure-${{ runner.os }}
          retention-days: 1

      - name: Check the step failed
        if: steps.devlanes.outcome != 'failure'
        run: |
          echo "::error::the start succeeded although broken exits 3"
          exit 1

  failed-test:
    name: 'Expected failure: test step'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The failing step is the point; the artifacts job checks that its logs were uploaded. Its
    # red X cannot be avoided: with continue-on-error on the step instead, the API reports the
    # step as a success and the action rightly uploads nothing.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the lane
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/basic
          artifact-name: devlanes-logs-failed-test
          retention-days: 1

      - name: Fail like a test would
        run: exit 1

  quiet:
    name: Passing job with a stop step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the lane
        id: devlanes
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/basic
          artifact-name: devlanes-logs-quiet

      # Nothing failed, so neither this step nor the post step may upload anything.
      - name: Stop the lane
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: stop
          working-directory: test/fixtures/basic
          artifact-name: devlanes-logs-quiet-stop

      - name: Check the start step's logs-dir has the logs
        run: node test/e2e/logs.mjs "$LOGS" unit-api.log unit-worker.log devlanes-doctor.txt
        env:
          LOGS: ${{ steps.devlanes.outputs.logs-dir }}

  two-lanes:
    name: Two projects in one job
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # devlanes gives a checkout one lane, also to anything below it, so each project gets a
      # checkout of its own next to the other (devlanes-run/devlanes#90).
      - name: Checkout the first project
        uses: actions/checkout@v7
        with:
          path: first

      - name: Checkout the second project
        uses: actions/checkout@v7
        with:
          path: second

      - name: Start the first project
        id: basic
        uses: ./first
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: first/test/fixtures/basic
          config: |
            proxy:
              lan: false
          upload-logs: always
          artifact-name: devlanes-logs-two-basic

      - name: Start the second project
        id: infra
        uses: ./first
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: second/test/fixtures/infra
          upload-logs: always
          artifact-name: devlanes-logs-two-infra
          cleanup: clean

      - name: Check each project has its own lane
        if: steps.basic.outputs.lane == steps.infra.outputs.lane
        run: |
          echo "::error::both projects use ${{ steps.basic.outputs.lane }}"
          exit 1

      - name: Check each lane has its own logs folder
        if: steps.basic.outputs.logs-dir == steps.infra.outputs.logs-dir
        run: |
          echo "::error::both lanes write to ${{ steps.basic.outputs.logs-dir }}"
          exit 1

      # The first project's post step must skip its stopped lane and leave the second alone.
      - name: Stop the first project
        uses: ./first
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: stop
          working-directory: first/test/fixtures/basic
          upload-logs: never

  install:
    name: Install only on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install devlanes
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: install
          # A Windows home must be private, which the runner's temp folder is not.
          home: ${{ runner.os == 'Linux' && format('{0}/devlanes', runner.temp) || '' }}

      - name: Use devlanes from a later step
        shell: bash
        run: |
          devlanes --version
          devlanes daemon status
          test -n "$NODE_EXTRA_CA_CERTS"

  failed-script:
    name: Failed with script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run a script that fails
        id: devlanes
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          command: with
          working-directory: test/fixtures/basic
          run: exit 3
          artifact-name: devlanes-logs-failed-script
          retention-days: 1

      - name: Check the step failed with the script's code
        if: steps.devlanes.outcome != 'failure' || steps.devlanes.outputs.exit-code != '3'
        run: |
          echo "::error::outcome ${{ steps.devlanes.outcome }}, exit-code ${{ steps.devlanes.outputs.exit-code }}"
          exit 1

  unnamed:
    name: Logs without access to the jobs API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No step fails: a token the API refuses must still upload, since the action cannot tell.
    # The artifacts job checks the upload and its fallback name.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the lane
        uses: ./
        with:
          version: ${{ env.DEVLANES_TEST_VERSION }}
          working-directory: test/fixtures/basic
          token: not-a-token
          retention-days: 1

  artifacts:
    name: Uploaded logs
    if: ${{ !cancelled() }}
    needs: [e2e, infra, failure, failed-test, quiet, two-lanes, failed-script, unnamed]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the logs
        uses: actions/download-artifact@v8
        with:
          pattern: devlanes-logs-*
          path: artifacts

      - name: Check the stop step's logs
        run: node test/e2e/logs.mjs artifacts/devlanes-logs-stop unit-api.log devlanes-doctor.txt devlanes-status.json infra-whoami.log

      - name: Check the failed starts' logs
        run: |
          node test/e2e/logs.mjs artifacts/devlanes-logs-failure-Linux unit-broken.log unit-api.log
          node test/e2e/logs.mjs artifacts/devlanes-logs-failure-Windows unit-broken.log unit-api.log

      - name: Check the logs of a job whose test step failed
        run: node test/e2e/logs.mjs artifacts/devlanes-logs-failed-test unit-api.log unit-worker.log

      - name: Check the failed script's logs
        run: node test/e2e/logs.mjs artifacts/devlanes-logs-failed-script unit-api.log unit-worker.log

      # With a token the API refuses, the name falls back to the job id and the runner's name.
      - name: Check the logs uploaded without access to the jobs API
        shell: bash
        run: |
          shopt -s nullglob
          found=(artifacts/devlanes-logs-unnamed-*-fixture-*)
          if [ ${#found[@]} -ne 1 ]; then
            echo "::error::expected one devlanes-logs-unnamed-<runner>-<lane> artifact: ${found[*]}"
            exit 1
          fi
          node test/e2e/logs.mjs "${found[0]}" unit-api.log

      - name: Check the second project's logs and that the stopped one uploaded nothing
        run: |
          node test/e2e/logs.mjs artifacts/devlanes-logs-two-infra unit-api.log infra-whoami.log
          test ! -e artifacts/devlanes-logs-two-basic

      - name: Check passing jobs uploaded nothing and matrix jobs got their own names
        shell: bash
        run: |
          shopt -s nullglob
          quiet=(artifacts/devlanes-logs-quiet*)
          if [ ${#quiet[@]} -ne 0 ]; then
            echo "::error::a passing job uploaded ${quiet[*]}"
            exit 1
          fi
          # One artifact per start job of the e2e matrix, named after the job, and none from its
          # passing with jobs.
          start=(artifacts/devlanes-logs-start-on-*)
          with=(artifacts/devlanes-logs-with-on-*)
          if [ ${#start[@]} -ne 5 ] || [ ${#with[@]} -ne 0 ]; then
            echo "::error::expected 5 start and 0 with artifacts: ${start[*]} ${with[*]}"
            exit 1
          fi

  # The one check branch rules require. It runs even when a job failed or was cancelled, since
  # a required check that is skipped counts as passed. failed-test fails on purpose and is left
  # out; artifacts needs it and checks that it did its job.
  gate:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, e2e, infra, failure, quiet, two-lanes, install, failed-script, unnamed, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::these jobs did not pass: $failed"
            exit 1
          fi
