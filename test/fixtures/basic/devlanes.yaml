# An API behind a hostname and a worker without a port, like most projects.
project: fixture
services:
  api:
    # Services run from this file's folder.
    run: [node, ../server.mjs]
    hosts: "api.${{ lane.domain }}"
    ready:
      http:
        path: /healthz
  worker:
    run: [node, ../worker.mjs]
    ready:
      log: worker ready
