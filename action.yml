# The Marketplace refuses a name that matches another GitHub account, and `devlanes` is a user
# that is not the project's.
name: Run devlanes
description: Install devlanes, start a project's services, containers and tasks, and stop them with their logs at the end of the job.
author: devlanes
branding:
  icon: layers
  color: yellow

inputs:
  version:
    description: >-
      devlanes version to install: `latest`, `next` or a release such as `0.7.0`, which is the
      oldest the action supports. Empty reads the version from the project's lockfile (pnpm, npm,
      yarn, bun, uv, poetry) or an exact version in package.json, searching `working-directory`
      and the folders above it up to the workspace, else uses 0.7.0, the release this version of
      the action was tested with.
    required: false
    default: ""
  command:
    description: >-
      What to do after installing: `start` brings up the lane and leaves it running for later
      steps, `with` runs `run` against the lane and stops it, `stop` stops the lane now and writes
      its logs, `install` only installs and prepares devlanes.
    required: false
    default: start
  run:
    description: >-
      Script to run against the lane with `command: with`. It runs in `working-directory` with the
      lane's environment, such as `DEVLANES_PUBLIC_URL_<SERVICE>`.
    required: false
    default: ""
  shell:
    description: >-
      Shell for `run`: `bash`, `sh`, `pwsh`, `powershell` or `cmd`. Defaults to `bash` on Linux and
      macOS and `pwsh` on Windows, like `run:` steps.
    required: false
    default: ""
  profile:
    description: Profiles from devlanes.yaml to start, separated by commas or newlines.
    required: false
    default: ""
  units:
    description: >-
      Units to start, separated by spaces or newlines, such as `api web` or `+api`. Without units
      or profiles, devlanes starts what the lane ran before, else its `default` profile.
    required: false
    default: ""
  timeout:
    description: How long to wait for every unit to be ready, such as `5m`. devlanes waits 180s by default.
    required: false
    default: ""
  working-directory:
    description: Directory that contains devlanes.yaml, relative to the workspace.
    required: false
    default: "."
  home:
    description: >-
      `DEVLANES_HOME` for this job. Empty keeps devlanes' default, `~/.devlanes`. Exported, so
      later devlanes commands reach the same daemon.
    required: false
    default: ""
  config:
    description: >-
      YAML merged into the user config.yaml before the daemon starts, passed as a string such as
      a `|` block. Only the first use of the action in a job applies it.
    required: false
    default: ""
  trust:
    description: >-
      On Linux, trust the devlanes CA in the system store and in the NSS store that Chromium
      reads. macOS and Windows runners cannot, and get a warning. Only the first use of the action
      in a job applies it.
    required: false
    default: "true"
  hosts-file:
    description: >-
      Hosts file entries for the lane's hostnames: `auto`, `true` or `false`. On Windows and macOS,
      `auto` writes them when `*.localhost` does not resolve and `true` always does. On Linux,
      `true` installs devlanes' /etc/hosts helper (which also trusts the CA) for programs that
      skip the system resolver, such as Wrangler's workerd; only the first use in a job does that.
    required: false
    default: auto
  low-ports:
    description: >-
      On Linux, let the proxy listen on 443 and 80, so public URLs carry no port. Only the first
      use of the action in a job applies it.
    required: false
    default: "true"
  export-env:
    description: >-
      With `command: start`, give later steps the lane's variables, such as
      `DEVLANES_PUBLIC_URL_<SERVICE>`.
    required: false
    default: "true"
  export-ca:
    description: >-
      Set `NODE_EXTRA_CA_CERTS`, `DENO_CERT`, `SSL_CERT_FILE` and `REQUESTS_CA_BUNDLE` for later
      steps and the `with` script, so Node, Deno, Python and tools built on OpenSSL trust the
      devlanes CA on every OS.
    required: false
    default: "true"
  upload-logs:
    description: >-
      When the logs are uploaded as an artifact: `on-failure`, `always` (or `true`) or `never` (or
      `false`). `on-failure` uploads when any step of the job failed or a unit had failed.
    required: false
    default: on-failure
  artifact-name:
    description: >-
      Name of the logs artifact. Defaults to `devlanes-logs-<job name>-<lane>`, such as
      `devlanes-logs-e2e-ubuntu-latest-acme-0`, which differs between matrix jobs and projects;
      when the API cannot name the job, the runner's name takes its place.
    required: false
    default: ""
  retention-days:
    description: Days to keep the logs artifact. Empty keeps the repository's setting.
    required: false
    default: ""
  cleanup:
    description: >-
      What the end of the job does: `stop` stops the lane and the daemon this step started,
      `clean` also runs `devlanes lane clean` and `devlanes infra down` (for self-hosted runners),
      `keep` leaves everything running and uploads no logs.
    required: false
    default: stop
  token:
    description: >-
      Token for reading this job from the GitHub API, which tells `upload-logs: on-failure` whether
      a step failed and names the default artifact. Rarely needs changing; private repositories
      need `actions: read` in the job's permissions.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed devlanes version.
  version-source:
    description: >-
      Where the version came from: `input`, the path of the lockfile or package.json that pins it,
      relative to the workspace (such as `pnpm-lock.yaml`), or `default`.
  home:
    description: The devlanes home in use. Set by every command but `stop`.
  lane:
    description: The lane reference, such as `acme@0`. Set by `start`, `with` and `stop`.
  lane-index:
    description: >-
      The lane number. Set by `command: start`.
  domain:
    description: >-
      The lane's domain, such as `acme.localhost`. Set by `command: start`.
  https-port:
    description: >-
      The port the HTTPS proxy listens on, 443 or a fallback such as 8443. Set by
      `command: start`.
  urls:
    description: >-
      JSON object of each service's URL, through the proxy when it has hostnames. Read one with
      `fromJSON(steps.<id>.outputs.urls).api`. Set by `command: start`.
  services:
    description: >-
      JSON object of each service's `state`, `kind`, `port`, `ports`, `url`, `public_url` and
      `urls`. Set by `command: start`.
  infra:
    description: >-
      JSON object of each container's `state`, `shared`, `ports` and `urls`; `ports` maps the
      container port (Compose) or port name (plain containers) to the host port. Set by
      `command: start`.
  env:
    description: >-
      JSON object of the lane's environment variables. Set by `command: start`.
  ca-cert:
    description: Path of the devlanes CA certificate. Set by every command but `stop`.
  ca-bundle:
    description: >-
      Path of the bundle with the system roots and the devlanes CA. Set by every command but
      `stop`.
  logs-dir:
    description: >-
      Folder of the lane's logs, written when the lane stops. Set by `start`, `with` and `stop`.
  exit-code:
    description: >-
      Exit code of `devlanes with`: the script's code, or 1 when the lane failed to start and the
      script did not run. Set by `command: with`.

runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
